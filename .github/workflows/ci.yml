name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TEST_PROJECT: tests/SqlMigrationLint.Tests/SqlMigrationLint.Tests.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json отсутствует; .NET 10 - текущий LTS, таргет проекта net10.0
          dotnet-version: 10.0.x

      - name: Restore
        # Восстановление тестового проекта тянет и корневой (ProjectReference)
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        # Сборка тестового проекта собирает и корневой sql-migration-lint.csproj через ProjectReference
        run: dotnet build ${{ env.TEST_PROJECT }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --no-build -c Release
